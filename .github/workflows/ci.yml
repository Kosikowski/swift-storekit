# The offline suite is green with the network cable unplugged: the store is simulated
# and the clock is manual, so there is no rig to stand up and nothing to reach.
#
# This runs with whatever Xcode the hosted image has — 26.6 at the time of writing —
# and everything measured in docs/ was measured with Xcode 27. That is deliberate and
# useful (it is what proves the package builds with the older SDK), and it means a
# green run here says nothing about StoreKit's behaviour.
#
# What is NOT run here is the hosted suite against real StoreKit (`make integration`).
# It has a lane of its own, nightly and not blocking: integration.yml.
# StoreKit's test environment is reported to be unreliable under command-line xcodebuild
# on hosted runners — not checked here — and a lane that fails for reasons of its own
# teaches people to ignore it.
# It is run by hand, from a Mac, before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: make check
    runs-on: macos-26
    # About five minutes on a hosted runner, the Demo's builds included.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}

      # A property of the runner image, so it is recorded rather than assumed.
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # The Demo's project is generated, not committed, and `make check` builds it.
      - name: XcodeGen
        run: brew install xcodegen

      # Layers, the macOS suite in debug and in release, the iOS build, proof that the
      # simulated store is absent from a release build, and the Demo — with its hosted
      # tests for the Mac and iOS, its UI tests, and once more in Release, linked. All
      # of that built, not run (see above).
      - name: Check
        run: make check

      # A filter that matches nothing passes, and so does a release run in which a
      # `#if DEBUG` has been drawn too wide: everything compiles, and nothing is left to
      # run. So each target has a floor, in each configuration, close enough under what
      # it runs today that a whole suite going missing is noticed — one floor across
      # the lot would not have noticed all of PurchaseCoreTests vanishing. Built
      # already, so this costs seconds. When a floor is in the way, raise it.
      - name: No suite has gone missing
        run: |
          count() { grep -o -E 'Test run with [0-9]+ tests' | grep -o -E '[0-9]+' | paste -sd+ - | bc; }
          floor() { # target, debug floor, release floor
            debug=$(swift test --filter "$1" 2>&1 | count)
            release=$(swift test -c release -Xswiftc -enable-testing --filter "$1" 2>&1 | count)
            echo "$1: $debug in debug (floor $2), $release in release (floor $3)"
            test "${debug:-0}" -ge "$2" && test "${release:-0}" -ge "$3"
          }
          floor PurchaseCoreTests 60 22
          floor PurchaseTestKitTests 95 27
          floor PurchaseStoreKitTests 27 27
          floor PurchaseLaunchTests 4 3
